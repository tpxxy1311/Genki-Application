<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tim Peters — application" />
    <title>Tim Peters</title>

    <!-- Setzt den Startzustand der Intro-Sequenz, bevor der erste Frame
         gezeichnet wird. Bewusst inline und nicht als Klasse im Markup: ohne
         JS laeuft keine Animation, und dann soll die Seite auch nicht mit
         unsichtbaren Elementen dastehen. -->
    <script>document.documentElement.classList.add('is-preload')</script>

    <!-- Ohne JS laeuft die Sequenz nicht -- dann muss die Abdeckung weg,
         sonst bliebe die Seite dauerhaft dahinter stehen. -->
    <noscript>
      <style>.loader-overlay { display: none; }</style>
    </noscript>
  </head>
  <body>
    <!-- Liegt ueber allem und blendet als Erstes aus. -->
    <div class="loader-overlay" aria-hidden="true"></div>

    <!-- Traegt den Verlauf. Eigenes Element, weil der Intro-Tween ihn
         skaliert und einblendet -- beides geht auf einem Body-Hintergrund
         nicht. -->
    <div class="backdrop" aria-hidden="true"></div>

    <!-- Fullscreen WebGL layer. The logo is centred by the camera, not by a
         box in the layout, so it can overflow freely as it rotates. -->
    <canvas id="scene" class="stage" aria-hidden="true"></canvas>

    <!-- Sits behind the canvas: the logo crops into each line as it turns. -->
    <h1 class="headline">
      <span class="headline__line headline__line--a">A different</span>
      <span class="headline__line headline__line--b">application</span>
      <span class="headline__line headline__line--c">approach</span>
    </h1>

    <!-- Real DOM on top: selectable, focusable, readable by assistive tech. -->
    <div class="overlay">
      <header class="overlay__row">
        <p class="overlay__brand">Tim Peters</p>
        <p class="overlay__intro">Frontend Engineer</p>
      </header>

      <footer class="overlay__row">
        <nav class="actions" aria-label="Documents">
          <a class="button button--glass" href="/resume.pdf" target="_blank">Resumee</a>
          <a class="button button--glass" href="/application.pdf" target="_blank">Application</a>
        </nav>

        <!-- Icons: Lucide (ISC), inline statt als Datei -- so erben sie ueber
             currentColor die Button-Farbe und sind ohne Extra-Request da.
             aria-hidden am svg, weil der Link seinen Namen schon aus aria-label
             bezieht; sonst laese ein Screenreader den Namen doppelt. -->
        <nav class="actions" aria-label="Profiles">
          <a class="button button--glass button--icon" href="https://tim-peters.work" target="_blank" aria-label="Portfolio">
            <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
              <path d="M2 12h20" />
            </svg>
          </a>

          <a class="button button--glass button--icon" href="https://github.com/tpxxy1311" target="_blank" aria-label="GitHub">
            <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
              <path d="M9 18c-4.51 2-5-2-7-2" />
            </svg>
          </a>

          <a class="button button--glass button--icon" href="mailto:timpeters.uxandweb@gmail.com" target="_blank" aria-label="E-Mail">
            <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect width="20" height="16" x="2" y="4" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </a>
        </nav>
      </footer>
    </div>

    <!-- Zwei Kreise, ein Anker: Cursor.js bewegt nur .cursor, die beiden
         Kinder haben ihre eigenen Transforms fuer den Hover-Zustand. -->
    <div id="cursor" class="cursor" aria-hidden="true">
      <span class="cursor__dot"></span>
      <span class="cursor__ring"></span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
